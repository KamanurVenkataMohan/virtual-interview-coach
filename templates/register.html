{% extends "base.html" %}

{% block content %}

<div class="auth-page">

    <div class="auth-card register-card fade-in">

        <div class="auth-icon">
            🚀
        </div>

        <h1>Create Account</h1>

        <p class="auth-subtitle">
            Create your account and start practicing interviews.
        </p>

        {% if error %}
        <div class="auth-alert error">
            {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="auth-alert success">
            {{ success }}
        </div>
        {% endif %}

        <form method="POST">

            <div class="input-group">

                <label for="full_name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    placeholder="Enter your full name"
                    required
                    autocomplete="name"
                >

            </div>

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    minlength="3"
                    required
                    autocomplete="username"
                >

            </div>

            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >

            </div>

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required
                    autocomplete="new-password"
                >

            </div>

            <div class="input-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    minlength="6"
                    required
                    autocomplete="new-password"
                >

            </div>

            <button
                type="submit"
                class="start-btn"
            >
                Create Account
            </button>

        </form>

        <div class="auth-divider">
            <span>Already have an account?</span>
        </div>

        <a
            href="{{ url_for('login') }}"
            class="auth-register-btn"
        >
            Back to Login
        </a>

    </div>

</div>

{% endblock %}
